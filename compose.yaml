services:
  tracker:
    build: .
    image: cc-changelog-tracker
    restart: unless-stopped
    env_file: .env
    # Agent SDK 會啟動 Claude Code 子程序. 用 init 回收結束的子程序, 並轉送停止訊號.
    init: true
    volumes:
      - tracker-data:/app/data
    # 限制 log 大小, 避免寫滿樹莓派的 SD 卡.
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "3"

volumes:
  tracker-data:
