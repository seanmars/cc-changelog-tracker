<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>cc-changelog-tracker 後台</title>
    <style>
      :root {
        color-scheme: light dark;
        --accent: #d97757;
        --bg: #f6f5f2;
        --card: #ffffff;
        --text: #1f1e1c;
        --muted: #6b6862;
        --border: #e3e0da;
        --ok: #2f7d4f;
        --warn: #b26a00;
        --error: #c0392b;
        --error-bg: #fdf0ee;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1b1a18;
          --card: #252421;
          --text: #ecebe8;
          --muted: #a09c94;
          --border: #3a3834;
          --ok: #5cbf86;
          --warn: #e0a040;
          --error: #ef7a6c;
          --error-bg: #3a2522;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.6 system-ui, -apple-system, "Segoe UI", "Noto Sans TC", sans-serif;
      }
      main { max-width: 960px; margin: 0 auto; padding: 32px 20px 64px; }
      h1 { margin: 0 0 24px; font-size: 22px; }
      h1 span { color: var(--accent); }
      h2 { margin: 0 0 16px; font-size: 17px; }
      section {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 20px;
        margin-bottom: 20px;
      }
      .status { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; }
      .badge { font-weight: 600; padding: 2px 10px; border-radius: 999px; border: 1px solid currentColor; }
      .badge.ok { color: var(--ok); }
      .badge.paused { color: var(--warn); }
      .muted { color: var(--muted); }
      .problems { margin: 12px 0 0; padding-left: 20px; color: var(--warn); }
      fieldset { border: 0; margin: 0 0 8px; padding: 0; }
      legend { font-weight: 600; margin-bottom: 8px; color: var(--muted); font-size: 13px; }
      .field { display: grid; grid-template-columns: 200px 1fr; gap: 12px; align-items: center; margin-bottom: 12px; }
      label { font-size: 14px; }
      .field.stacked { grid-template-columns: 1fr; gap: 6px; }
      .label-row { display: flex; justify-content: space-between; align-items: center; }
      .hint { font-size: 13px; }
      input, select, textarea {
        width: 100%;
        padding: 7px 10px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--bg);
        color: var(--text);
        font: 14px ui-monospace, "Cascadia Code", Consolas, monospace;
      }
      textarea { resize: vertical; line-height: 1.5; }
      input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
      .actions { display: flex; gap: 12px; align-items: center; margin-top: 8px; }
      button {
        padding: 8px 20px;
        border: 0;
        border-radius: 6px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled { opacity: 0.6; cursor: wait; }
      button.small { padding: 4px 14px; font-size: 13px; }
      button.secondary { background: transparent; color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
      .message.error { color: var(--error); }
      .section-header { display: flex; flex-wrap: wrap; gap: 8px 12px; justify-content: space-between; align-items: baseline; }
      .inline-form { display: flex; gap: 8px; align-items: center; font-size: 14px; }
      .inline-form input { width: 72px; }
      #releases-message { margin: 0 0 12px; font-size: 14px; }
      #releases-message:empty { display: none; }
      .release { border-top: 1px solid var(--border); padding: 8px 0; }
      .release:first-child { border-top: 0; }
      .release summary { display: flex; gap: 12px; align-items: center; cursor: pointer; list-style: none; }
      .release summary::before { content: '▸'; color: var(--muted); }
      .release[open] summary::before { content: '▾'; }
      .release summary .count { margin-right: auto; }
      .release p { margin: 8px 0; }
      .release ul { margin: 0 0 8px; padding-left: 20px; font-size: 14px; }
      .tag { display: inline-block; min-width: 72px; color: var(--muted); font: 12px ui-monospace, Consolas, monospace; }
      .scroll-box { max-height: 360px; overflow-y: auto; border: 1px solid var(--border); border-radius: 6px; }
      #releases { padding: 0 12px; }
      table { width: 100%; border-collapse: collapse; font-size: 13px; }
      th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
      th { color: var(--muted); font-weight: 600; position: sticky; top: 0; background: var(--card); }
      td.time { white-space: nowrap; color: var(--muted); font-family: ui-monospace, Consolas, monospace; }
      td.message { word-break: break-word; }
      tr.error td { background: var(--error-bg); }
      tr.error td.message { color: var(--error); }
      @media (max-width: 640px) {
        .field { grid-template-columns: 1fr; gap: 4px; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1><span>●</span> cc-changelog-tracker 後台</h1>

      <section>
        <h2>狀態</h2>
        <div class="status">
          <span id="badge" class="badge">載入中</span>
          <span class="muted">最後處理的版本: <strong id="last-version">-</strong></span>
        </div>
        <ul id="problems" class="problems" hidden></ul>
      </section>

      <section>
        <div class="section-header">
          <h2>Logs</h2>
          <span class="muted">每 5 秒自動更新</span>
        </div>
        <div class="scroll-box">
          <table>
            <thead>
              <tr><th>時間</th><th>內容</th></tr>
            </thead>
            <tbody id="logs"></tbody>
          </table>
        </div>
      </section>

      <section>
        <div class="section-header">
          <h2>版本</h2>
          <form id="fetch-form" class="inline-form">
            <label for="fetch-count">抓取最近</label>
            <input id="fetch-count" name="count" type="number" min="1" max="20" value="5" />
            <span>個版本</span>
            <button type="submit">抓取</button>
          </form>
        </div>
        <p id="releases-message" class="message muted"></p>
        <div id="releases" class="scroll-box"></div>
      </section>

      <section>
        <h2>設定</h2>
        <form id="settings" autocomplete="off">
          <fieldset>
            <legend>通知與金鑰</legend>
            <div class="field">
              <label for="discordWebhookUrl">Discord webhook URL</label>
              <input id="discordWebhookUrl" name="discordWebhookUrl" placeholder="https://discord.com/api/webhooks/..." />
            </div>
            <div class="field">
              <label for="geminiApiKey">Gemini API key</label>
              <input id="geminiApiKey" name="geminiApiKey" />
            </div>
            <div class="field">
              <label for="claudeAuthType">Claude 認證方式</label>
              <select id="claudeAuthType" name="claudeAuthType">
                <option value="oauth-token">OAuth token (claude setup-token)</option>
                <option value="api-key">Anthropic API key</option>
              </select>
            </div>
            <div class="field">
              <label for="claudeKey">Claude key</label>
              <input id="claudeKey" name="claudeKey" />
            </div>
          </fieldset>
          <fieldset>
            <legend>進階</legend>
            <div class="field">
              <label for="checkIntervalMinutes">檢查間隔 (分鐘)</label>
              <input id="checkIntervalMinutes" name="checkIntervalMinutes" inputmode="decimal" />
            </div>
            <div class="field">
              <label for="geminiModel">Gemini model</label>
              <input id="geminiModel" name="geminiModel" />
            </div>
            <div class="field">
              <label for="claudeModel">Claude model</label>
              <input id="claudeModel" name="claudeModel" />
            </div>
            <div class="field">
              <label for="changelogUrl">CHANGELOG 下載 URL</label>
              <input id="changelogUrl" name="changelogUrl" />
            </div>
            <div class="field">
              <label for="linkUrl">通知中的 CHANGELOG 連結</label>
              <input id="linkUrl" name="linkUrl" />
            </div>
          </fieldset>
          <fieldset>
            <legend>翻譯</legend>
            <div class="field stacked">
              <div class="label-row">
                <label for="translationPrompt">翻譯 prompt</label>
                <button type="button" id="restore-prompt" class="small secondary">還原預設</button>
              </div>
              <textarea id="translationPrompt" name="translationPrompt" rows="12"></textarea>
              <span class="muted hint">只需要寫翻譯的要求. JSON 格式的規則固定在程式中. 儲存後, 新的翻譯和「重新翻譯」都會使用這個 prompt.</span>
            </div>
          </fieldset>
          <div class="actions">
            <button type="submit">儲存</button>
            <span id="message" class="message muted"></span>
          </div>
        </form>
      </section>
    </main>

    <script type="module">
      const form = document.querySelector('#settings');
      const message = document.querySelector('#message');
      const fetchForm = document.querySelector('#fetch-form');
      const fetchButton = fetchForm.querySelector('button');
      const releasesMessage = document.querySelector('#releases-message');
      const timeFormat = new Intl.DateTimeFormat('zh-TW', { dateStyle: 'short', timeStyle: 'medium', hour12: false });
      let wasFetching = false;

      async function api(path, options) {
        const res = await fetch(path, options);
        const body = await res.json();
        if (!res.ok) throw new Error(body.error ?? `HTTP ${res.status}`);
        return body;
      }

      function apiJson(method, path, body) {
        return api(path, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      }

      function showMessage(element, text, isError = false) {
        element.className = `message ${isError ? 'error' : 'muted'}`;
        element.textContent = text;
      }

      function renderStatus(status) {
        fetchButton.disabled = status.fetching;
        fetchButton.textContent = status.fetching ? '抓取中...' : '抓取';

        const badge = document.querySelector('#badge');
        badge.textContent = status.ready ? 'Tracking 中' : '已暫停: 設定未完成';
        badge.className = `badge ${status.ready ? 'ok' : 'paused'}`;
        document.querySelector('#last-version').textContent = status.lastVersion ?? '尚未初始化';

        const problems = document.querySelector('#problems');
        problems.replaceChildren(
          ...status.problems.map((text) => Object.assign(document.createElement('li'), { textContent: text })),
        );
        problems.hidden = status.problems.length === 0;
      }

      // log 內容可能包含外部服務的錯誤訊息, 一律用 textContent, 不用 innerHTML.
      function renderLogs(entries) {
        const rows = entries.map((entry) => {
          const row = document.createElement('tr');
          row.className = entry.level;
          const time = Object.assign(document.createElement('td'), {
            className: 'time',
            textContent: timeFormat.format(new Date(entry.time)),
          });
          const text = Object.assign(document.createElement('td'), { className: 'message', textContent: entry.message });
          row.append(time, text);
          return row;
        });
        document.querySelector('#logs').replaceChildren(...rows);
      }

      function renderReleases(releases) {
        const container = document.querySelector('#releases');
        // 重新產生清單時保留已展開的版本.
        const opened = new Set([...container.querySelectorAll('details[open]')].map((item) => item.dataset.version));
        const items = releases.map((release) => {
          const item = Object.assign(document.createElement('details'), { className: 'release', open: opened.has(release.version) });
          item.dataset.version = release.version;

          const summary = document.createElement('summary');
          summary.append(
            Object.assign(document.createElement('strong'), { textContent: `v${release.version}` }),
            Object.assign(document.createElement('span'), { className: 'muted count', textContent: `${release.entries.length} 條` }),
            summaryButton('重新翻譯', 'small secondary', (button) => retranslateRelease(release.version, button)),
            summaryButton('送出通知', 'small', (button) => notifyRelease(release.version, button)),
          );

          const entries = release.entries.map((entry) => {
            const li = document.createElement('li');
            li.append(Object.assign(document.createElement('span'), { className: 'tag', textContent: entry.category }), entry.text);
            return li;
          });
          const list = document.createElement('ul');
          list.append(...entries);
          item.append(summary, Object.assign(document.createElement('p'), { textContent: release.summary }), list);
          return item;
        });
        if (items.length === 0) {
          items.push(Object.assign(document.createElement('p'), { className: 'muted', textContent: '還沒有任何版本, 請先抓取' }));
        }
        container.replaceChildren(...items);
      }

      function summaryButton(text, className, onClick) {
        const button = Object.assign(document.createElement('button'), { type: 'button', className, textContent: text });
        button.addEventListener('click', (event) => {
          // 按鈕在 summary 裡面, 不讓點擊同時展開或收合.
          event.preventDefault();
          onClick(button);
        });
        return button;
      }

      async function loadReleases() {
        renderReleases(await api('/api/releases'));
      }

      async function retranslateRelease(version, button) {
        button.disabled = true;
        showMessage(releasesMessage, `重新翻譯 v${version} 中...`);
        try {
          await apiJson('POST', '/api/releases/retranslate', { version });
          showMessage(releasesMessage, `已重新翻譯 v${version}`);
          await loadReleases();
        } catch (error) {
          showMessage(releasesMessage, `重新翻譯 v${version} 失敗: ${error.message}`, true);
        } finally {
          button.disabled = false;
          refresh();
        }
      }

      async function notifyRelease(version, button) {
        if (!confirm(`要送出 v${version} 的通知到 Discord 嗎?`)) return;
        button.disabled = true;
        showMessage(releasesMessage, `送出 v${version} 的通知中...`);
        try {
          await apiJson('POST', '/api/releases/notify', { version });
          showMessage(releasesMessage, `已送出 v${version} 的通知`);
        } catch (error) {
          showMessage(releasesMessage, `送出 v${version} 失敗: ${error.message}`, true);
        } finally {
          button.disabled = false;
          refresh();
        }
      }

      async function refresh() {
        try {
          const [status, logs] = await Promise.all([api('/api/status'), api('/api/logs')]);
          renderStatus(status);
          renderLogs(logs);
          // 抓取中每次都更新版本清單, 抓取結束時再更新最後一次.
          if (status.fetching || wasFetching) await loadReleases();
          if (wasFetching && !status.fetching) showMessage(releasesMessage, '抓取結束, 結果請看 Logs');
          wasFetching = status.fetching;
        } catch (error) {
          document.querySelector('#badge').textContent = `無法連線: ${error.message}`;
        }
      }

      fetchForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        try {
          const status = await apiJson('POST', '/api/releases/fetch', { count: Number(fetchForm.elements.count.value) });
          renderStatus(status);
          showMessage(releasesMessage, '開始抓取, 進度會顯示在 Logs');
          await refresh();
        } catch (error) {
          showMessage(releasesMessage, `抓取失敗: ${error.message}`, true);
        }
      });

      async function loadSettings() {
        const settings = await api('/api/settings');
        for (const [key, value] of Object.entries(settings)) {
          const input = form.elements.namedItem(key);
          if (input) input.value = value;
        }
      }

      // 只填入表單, 按「儲存」後才生效.
      document.querySelector('#restore-prompt').addEventListener('click', async () => {
        try {
          const defaults = await api('/api/settings/defaults');
          form.elements.namedItem('translationPrompt').value = defaults.translationPrompt;
          showMessage(message, '已填入預設 prompt, 按「儲存」後生效');
        } catch (error) {
          showMessage(message, `讀取預設 prompt 失敗: ${error.message}`, true);
        }
      });

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const button = form.querySelector('button[type="submit"]');
        button.disabled = true;
        showMessage(message, '儲存中...');
        try {
          const status = await apiJson('PUT', '/api/settings', Object.fromEntries(new FormData(form)));
          renderStatus(status);
          showMessage(message, status.ready ? '已儲存, 開始 tracking' : '已儲存, 但設定還沒完成');
          await loadSettings();
          setTimeout(refresh, 1000);
        } catch (error) {
          showMessage(message, `儲存失敗: ${error.message}`, true);
        } finally {
          button.disabled = false;
        }
      });

      await Promise.all([loadSettings(), loadReleases(), refresh()]);
      setInterval(refresh, 5000);
    </script>
  </body>
</html>
